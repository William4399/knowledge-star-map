<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03060f">
<meta name="description" content="知识星图：面向软件工程学生的可视化知识图谱与能力验证工具。点亮知识点，生成成长路径与能力档案。">
<title>知识星图 · 软件工程能力星图</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="知识星图">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="graph">

<canvas id="starfield"></canvas>
<div id="graph-container"></div>

<div class="app-shell">

  <header class="topbar">
    <a class="brand" href="#graph" aria-label="知识星图首页">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-text">
        <b>知识星图</b>
        <em>SOFTWARE ENGINEERING · CS2023</em>
      </span>
    </a>

    <nav class="tabs" id="tabs" role="tablist" aria-label="主导航">
      <button class="tab active" data-view="graph" role="tab" aria-selected="true">星图</button>
      <button class="tab" data-view="path" role="tab" aria-selected="false" tabindex="-1">成长路径</button>
      <button class="tab" data-view="plan" role="tab" aria-selected="false" tabindex="-1">学习计划</button>
      <button class="tab" data-view="profile" role="tab" aria-selected="false" tabindex="-1">我的</button>
    </nav>

    <div class="top-actions">
      <button class="chip" id="direction-chip" title="点击切换目标方向">方向 · —</button>
      <button class="icon-btn" id="help-btn" title="新手引导 / 重做测评" aria-label="打开新手引导">?</button>
    </div>
  </header>

  <section id="view-graph" class="view view-graph" aria-label="知识星图">
    <div class="graph-toolbar">
      <button class="btn ghost sm" id="node-list">节点清单</button>
      <button class="btn ghost sm" id="reset-view">重置视角</button>
      <button class="btn ghost sm" id="toggle-highlight" aria-pressed="true">推荐高亮 · 开</button>
    </div>

    <aside class="detail-card" id="detail" aria-label="知识点详情">
      <button class="close-btn" data-close-detail aria-label="关闭详情">✕</button>
      <div id="detail-content"></div>
    </aside>

    <div class="status-bar" id="status"></div>
  </section>

  <section id="view-path" class="view view-page" hidden aria-label="成长路径">
    <div class="page-wrap" id="path-root"></div>
  </section>

  <section id="view-plan" class="view view-page" hidden aria-label="学习计划">
    <div class="page-wrap" id="plan-root"></div>
  </section>

  <section id="view-profile" class="view view-page" hidden aria-label="我的星空">
    <div class="page-wrap" id="profile-root"></div>
  </section>

  <nav class="bottom-nav" aria-label="移动端导航">
    <button class="bottom-tab active" data-view="graph"><span aria-hidden="true">✦</span><em>星图</em></button>
    <button class="bottom-tab" data-view="path"><span aria-hidden="true">◈</span><em>路径</em></button>
    <button class="bottom-tab" data-view="plan"><span aria-hidden="true">✧</span><em>计划</em></button>
    <button class="bottom-tab" data-view="profile"><span aria-hidden="true">◉</span><em>我的</em></button>
  </nav>

</div>

<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-mark" aria-hidden="true">✦</div>
    <h1>知识星图</h1>
    <p>正在连接星空…</p>
    <div class="boot-bar" aria-hidden="true"><i></i></div>
  </div>
</div>

<script src="force-graph.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
